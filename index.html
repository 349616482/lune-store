<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUNE Cart System</title>
<style>
  :root {
    --lune-black: #111111; --lune-red: #c8102e; --lune-gold: #d4af37; --bg-light: #fafafa;
  }
  body {
    font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding: 0;
    background: transparent; color: var(--lune-black);
  }

  /* --- BUTTON MODE STYLES --- */
  #button-mode { display: none; height: 100vh; align-items: center; justify-content: center; padding: 5px; box-sizing: border-box; }
  .add-btn {
    background: var(--lune-black); color: white; border: none; padding: 12px;
    font-weight: bold; text-transform: uppercase; cursor: pointer; width: 100%; border-radius: 4px; transition: 0.2s; font-size: 14px;
  }
  .add-btn:hover { background: var(--lune-gold); color: black; }
  .add-btn.success { background: #28a745; color: white; }

  /* --- CART MODE STYLES --- */
  #cart-mode { display: none; max-width: 600px; margin: 0 auto; padding: 20px; background: white; border-top: 5px solid var(--lune-red); border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
  .cart-header { font-size: 24px; font-weight: 900; text-transform: uppercase; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px; color: var(--lune-black); }
  .cart-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px dashed #ccc; font-size: 15px; }
  .discount-line { color: var(--lune-red); font-weight: bold; font-size: 13px; }
  
  .cart-totals { background: var(--bg-light); padding: 20px; margin-top: 20px; border-radius: 4px; }
  .row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 15px; }
  .grand-total { font-weight: bold; font-size: 20px; border-top: 2px solid var(--lune-black); padding-top: 10px; margin-top: 5px; }
  
  .checkout-btn { width: 100%; padding: 15px; background: var(--lune-red); color: white; border: none; font-weight: bold; text-transform: uppercase; cursor: pointer; margin-top: 20px; border-radius: 4px; font-size: 16px; letter-spacing: 1px;}
  .checkout-btn:hover { background: var(--lune-black); }
  .clear-btn { background: transparent; border: none; color: #999; text-decoration: underline; cursor: pointer; font-size: 12px; margin-top: 15px; width: 100%; }
</style>
</head>
<body>

<div id="button-mode">
  <button id="the-button" class="add-btn" onclick="addToCart()">ADD TO BAG</button>
</div>

<div id="cart-mode">
  <div class="cart-header">LUNE BAG</div>
  <div id="cart-items"></div>
  <div class="cart-totals">
    <div class="row"><span>Subtotal</span><span id="subtotal">$0.00</span></div>
    <div class="row"><span>Shipping</span><span id="shipping">$0.00</span></div>
    <div class="row grand-total"><span>Total</span><span id="total">$0.00</span></div>
  </div>
  <button class="checkout-btn" onclick="checkout()">Checkout Securely</button>
  <button class="clear-btn" onclick="clearCart()">Empty Cart</button>
</div>

<script>
  // 1. Read the secret link codes
  const params = new URLSearchParams(window.location.search);
  const isButton = params.get('button') === 'true';
  const prodName = params.get('name');
  const prodPrice = parseFloat(params.get('price'));
  const prodBogo = params.get('bogo') === 'true';

  // 2. Memory Functions
  function getCart() { return JSON.parse(localStorage.getItem('lune_cart')) || []; }
  function saveCart(cart) { localStorage.setItem('lune_cart', JSON.stringify(cart)); }

  // 3. Decide which mode to show
  if (isButton) {
    document.getElementById('button-mode').style.display = 'flex';
    if(prodPrice) { document.getElementById('the-button').innerText = `ADD TO BAG - $${prodPrice.toFixed(2)}`; }
  } else {
    document.getElementById('cart-mode').style.display = 'block';
    renderCart();
  }

  // 4. ADD TO CART FUNCTION
  function addToCart() {
    if (!prodName || !prodPrice) return alert("Product information missing from link!");
    
    let cart = getCart();
    let match = cart.find(i => i.name === prodName);
    if (match) match.qty++; else cart.push({ name: prodName, price: prodPrice, qty: 1, bogo: prodBogo });
    saveCart(cart);

    // Button success animation
    let btn = document.getElementById('the-button');
    let oldText = btn.innerText;
    btn.innerText = 'ADDED TO BAG ✓';
    btn.classList.add('success');
    setTimeout(() => { btn.innerText = oldText; btn.classList.remove('success'); }, 2000);
  }

  // 5. RENDER CART FUNCTION
  function renderCart() {
    let cart = getCart();
    let itemsDiv = document.getElementById('cart-items');
    
    if (cart.length === 0) {
      itemsDiv.innerHTML = '<p style="text-align:center; color:#999; margin: 30px 0;">Your bag is empty.</p>';
      document.getElementById('subtotal').innerText = '$0.00';
      document.getElementById('shipping').innerText = '$0.00';
      document.getElementById('total').innerText = '$0.00';
      return;
    }

    itemsDiv.innerHTML = '';
    let subtotal = 0; let savings = 0;
    
    cart.forEach(item => {
      let cost = item.price * item.qty;
      subtotal += cost;
      
      // Calculate BOGO
      if (item.bogo && item.qty >= 2) {
        let freebies = Math.floor(item.qty / 2);
        savings += (freebies * item.price);
      }
      itemsDiv.innerHTML += `<div class="cart-item"><span>${item.qty}x ${item.name}</span><span>$${cost.toFixed(2)}</span></div>`;
    });

    if (savings > 0) {
        itemsDiv.innerHTML += `<div class="cart-item discount-line"><span>BOGO Free Item</span><span>-$${savings.toFixed(2)}</span></div>`;
    }

    let afterDisc = subtotal - savings;
    let ship = (afterDisc > 0 && afterDisc < 100) ? 10.00 : 0.00;
    let final = afterDisc + ship; // You can add tax here later if needed

    document.getElementById('subtotal').innerText = '$' + afterDisc.toFixed(2);
    document.getElementById('shipping').innerText = ship === 0 ? 'FREE' : '$' + ship.toFixed(2);
    document.getElementById('total').innerText = '$' + final.toFixed(2);
  }

  function clearCart() {
      localStorage.removeItem('lune_cart');
      renderCart();
  }

  function checkout() {
      if(getCart().length === 0) return alert('Your cart is empty!');
      alert('Order Confirmed! Checkout logic goes here.');
      clearCart();
  }

  // Listens for changes so the cart auto-updates!
  window.addEventListener('storage', (e) => {
      if(e.key === 'lune_cart' && !isButton) renderCart();
  });
</script>
</body>
</html>
