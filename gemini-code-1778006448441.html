<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUNE Store & Cart</title>
<style>
  :root {
    --lune-black: #111111;
    --lune-red: #c8102e;
    --lune-gold: #d4af37;
    --lune-white: #ffffff;
    --bg-light: #fafafa;
  }

  html, body {
    margin: 0; padding: 0;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background-color: transparent; /* Helps it blend into Google Sites */
    color: var(--lune-black);
    overflow-x: hidden;
  }

  /* TOP NAVIGATION INSIDE THE EMBED */
  .store-nav {
    display: flex; justify-content: space-between; align-items: center;
    padding: 15px 20px; background: var(--lune-white);
    border-bottom: 2px solid #eee; position: sticky; top: 0; z-index: 50;
  }
  .store-title { font-size: 24px; font-weight: 200; letter-spacing: 8px; text-transform: uppercase; margin: 0; }
  
  .cart-btn-nav {
    background: var(--lune-black); color: var(--lune-white);
    padding: 10px 20px; border-radius: 30px; font-weight: bold;
    border: none; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s;
  }
  .cart-btn-nav:hover { background: var(--lune-gold); color: var(--lune-black); }

  /* STORE LAYOUT */
  .store-container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
  .section-title { font-size: 22px; font-weight: 900; text-transform: uppercase; border-left: 5px solid var(--lune-gold); padding-left: 10px; margin: 30px 0 15px 0; }
  
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
  
  .product-card {
    border: 1px solid #eaeaea; padding: 20px; text-align: center; background: var(--lune-white);
    position: relative; border-radius: 8px; transition: 0.3s;
  }
  .product-card:hover { border-color: var(--lune-gold); box-shadow: 0 4px 15px rgba(0,0,0,0.05); transform: translateY(-2px); }
  .product-card .badge { position: absolute; top: 10px; left: 10px; background: var(--lune-red); color: white; font-size: 10px; padding: 4px 8px; font-weight: bold; border-radius: 3px; }
  .product-card .icon { font-size: 40px; margin-bottom: 10px; }
  .product-card .title { font-weight: 800; font-size: 14px; margin-bottom: 5px; text-transform: uppercase; }
  .product-card .price { color: #666; font-size: 14px; margin-bottom: 15px; font-weight: bold; }
  .product-card button {
    background: var(--lune-black); color: white; border: none; width: 100%;
    padding: 12px; border-radius: 4px; cursor: pointer; font-weight: bold; text-transform: uppercase; transition: 0.2s;
  }
  .product-card button:hover { background: var(--lune-gold); color: var(--lune-black); }

  /* SLIDE-OUT CART */
  .cart-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 99; display: none; }
  .cart-drawer {
    position: fixed; top: 0; right: -400px; width: 100%; max-width: 350px;
    height: 100%; background: var(--lune-white); z-index: 100;
    box-shadow: -5px 0 20px rgba(0,0,0,0.1); transition: right 0.3s ease;
    display: flex; flex-direction: column;
  }
  .cart-drawer.open { right: 0; }
  .cart-header { display: flex; justify-content: space-between; align-items: center; padding: 20px; border-bottom: 2px solid var(--lune-black); background: var(--bg-light); }
  .cart-header h2 { margin: 0; color: var(--lune-red); font-size: 18px; letter-spacing: 2px; }
  .close-cart { background: transparent; border: none; font-size: 24px; cursor: pointer; }
  
  .cart-body { padding: 20px; flex-grow: 1; overflow-y: auto; }
  .cart-item { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 14px; border-bottom: 1px dashed #ccc; padding-bottom: 10px; }
  
  .promo-box { display: flex; gap: 5px; margin-top: 15px; }
  .promo-box input { padding: 8px; border: 1px solid #ccc; flex-grow: 1; border-radius: 4px; }
  .promo-box button { background: var(--lune-black); color: white; border: none; padding: 8px 12px; cursor: pointer; font-weight: bold; border-radius: 4px; }

  .cart-footer { padding: 20px; background: var(--bg-light); border-top: 1px solid #ddd; font-size: 14px; }
  .row { display: flex; justify-content: space-between; margin-bottom: 6px; }
  .grand-total { font-weight: bold; font-size: 18px; border-top: 2px solid var(--lune-black); padding-top: 10px; margin-top: 5px; }
  
  .btn-checkout { width: 100%; padding: 15px; background: var(--lune-red); color: white; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: 15px; border-radius: 4px;}
  .btn-checkout:hover { background: var(--lune-black); }
</style>
</head>
<body>

<div class="store-nav">
  <h1 class="store-title">SHOP LUNE</h1>
  <button class="cart-btn-nav" onclick="openCart()">🛒 <span id="nav-cart-count">Cart (0)</span></button>
</div>

<div class="store-container">
  
  <div class="section-title">Men's Collection</div>
  <div class="grid">
    <div class="product-card">
      <div class="badge">BOGO</div>
      <div class="icon">🌑</div>
      <div class="title">Charcoal Texture Clay</div>
      <div class="price">$18.00</div>
      <button onclick="addToBag('Charcoal Clay', 18, true)">Add to Bag</button>
    </div>
    <div class="product-card">
      <div class="icon">🌲</div>
      <div class="title">Cedarwood Shampoo</div>
      <div class="price">$22.00</div>
      <button onclick="addToBag('Cedarwood Shampoo', 22, false)">Add to Bag</button>
    </div>
  </div>

  <div class="section-title" style="border-color: var(--lune-red);">Women's Collection</div>
  <div class="grid">
    <div class="product-card">
      <div class="badge">BOGO</div>
      <div class="icon">✨</div>
      <div class="title">Luminous Shine Oil</div>
      <div class="price">$28.00</div>
      <button onclick="addToBag('Shine Oil', 28, true)">Add to Bag</button>
    </div>
    <div class="product-card">
      <div class="icon">🌸</div>
      <div class="title">Dreamer Repair Mask</div>
      <div class="price">$34.00</div>
      <button onclick="addToBag('Repair Mask', 34, false)">Add to Bag</button>
    </div>
  </div>

</div>

<div class="cart-overlay" id="cart-overlay" onclick="closeCart()"></div>
<div class="cart-drawer" id="cart-drawer">
  <div class="cart-header">
    <h2>LUNE BAG</h2>
    <button class="close-cart" onclick="closeCart()">×</button>
  </div>
  
  <div class="cart-body">
    <div id="cart-items-list"><p style="color:#999; text-align:center; margin-top:20px;">Your bag is empty.</p></div>
    
    <div class="promo-box">
      <input type="text" id="promo-input" placeholder="Promo Code (GLOW15)">
      <button onclick="applyPromoCode()">Apply</button>
    </div>
  </div>
  
  <div class="cart-footer">
    <div class="row"><span>Subtotal</span><span id="view-sub">$0.00</span></div>
    <div class="row" style="color:var(--lune-red)"><span>Discounts</span><span id="view-disc">-$0.00</span></div>
    <div class="row"><span>HST (13%)</span><span id="view-tax">$0.00</span></div>
    <div class="row"><span>Shipping</span><span id="view-ship">$0.00</span></div>
    <div class="row grand-total"><span>Total</span><span id="view-total">$0.00</span></div>
    
    <button class="btn-checkout" onclick="alert('Proceeding to Checkout...')">Checkout Now</button>
  </div>
</div>

<script>
  // CART LOGIC
  let bag = [];
  let hasPromo = false;

  function openCart() {
    document.getElementById('cart-overlay').style.display = 'block';
    setTimeout(() => { document.getElementById('cart-drawer').classList.add('open'); }, 10);
  }
  
  function closeCart() {
    document.getElementById('cart-drawer').classList.remove('open');
    setTimeout(() => { document.getElementById('cart-overlay').style.display = 'none'; }, 300);
  }

  function addToBag(name, price, bogo) {
    let match = bag.find(item => item.name === name);
    if (match) { match.qty++; } else { bag.push({ name, price, qty: 1, bogo }); }
    calculate();
    openCart();
  }

  function applyPromoCode() {
    let input = document.getElementById('promo-input').value.toUpperCase();
    if (input === 'GLOW15') {
      hasPromo = true;
      alert("Promo GLOW15 Applied!");
      calculate();
    } else { alert("Invalid Code"); }
  }

  function calculate() {
    const list = document.getElementById('cart-items-list');
    const navBtn = document.getElementById('nav-cart-count');
    
    if (bag.length === 0) {
      list.innerHTML = '<p style="color:#999; text-align:center; margin-top:20px;">Your bag is empty.</p>';
      navBtn.innerText = "Cart (0)";
      document.getElementById('view-sub').innerText = "$0.00";
      document.getElementById('view-disc').innerText = "-$0.00";
      document.getElementById('view-tax').innerText = "$0.00";
      document.getElementById('view-ship').innerText = "$0.00";
      document.getElementById('view-total').innerText = "$0.00";
      return;
    }

    list.innerHTML = '';
    let totalItems = 0; let subtotal = 0; let savings = 0; let allSingleItems = [];

    bag.forEach(item => {
      totalItems += item.qty;
      let cost = item.price * item.qty;
      subtotal += cost;

      if (item.bogo && item.qty >= 2) {
        let freebies = Math.floor(item.qty / 2);
        savings += (freebies * item.price);
      }

      for(let i=0; i < item.qty; i++) { allSingleItems.push(item.price); }
      list.innerHTML += `<div class="cart-item"><span>${item.qty}x ${item.name}</span><span>$${cost.toFixed(2)}</span></div>`;
    });

    if (allSingleItems.length >= 4) {
      allSingleItems.sort((a,b) => a - b);
      let bundleDisc = allSingleItems[0] * 0.10;
      savings += bundleDisc;
      list.innerHTML += `<div style="color:var(--lune-red); font-size: 12px; font-weight: bold; margin-bottom:5px;">Bundle Deal: -$${bundleDisc.toFixed(2)}</div>`;
    }

    if (hasPromo) {
      let promoDisc = (subtotal - savings) * 0.15;
      savings += promoDisc;
      list.innerHTML += `<div style="color:var(--lune-red); font-size: 12px; font-weight: bold;">GLOW15: -$${promoDisc.toFixed(2)}</div>`;
    }

    navBtn.innerText = `Cart (${totalItems})`;
    
    let afterDisc = subtotal - savings;
    let tax = afterDisc * 0.13;
    let ship = (afterDisc > 0 && afterDisc < 100) ? 10.00 : 0.00;
    let final = afterDisc + tax + ship;

    document.getElementById('view-sub').innerText = "$" + subtotal.toFixed(2);
    document.getElementById('view-disc').innerText = "-$" + savings.toFixed(2);
    document.getElementById('view-tax').innerText = "$" + tax.toFixed(2);
    document.getElementById('view-ship').innerText = (ship === 0 && afterDisc > 0) ? "FREE" : "$" + ship.toFixed(2);
    document.getElementById('view-total').innerText = "$" + final.toFixed(2);
  }
</script>
</body>
</html>
